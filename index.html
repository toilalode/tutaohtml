<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tổng Hợp Kiếm Pháp</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tổng Hợp Kiếm Pháp"><meta name="theme-color" content="#020005">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// Hiện lỗi JS ngay trên màn hình (để biết vì sao màn hình đen)
(function(){function show(m){var d=document.getElementById('errbox');if(!d){d=document.createElement('pre');d.id='errbox';d.style.cssText='position:fixed;left:0;right:0;top:0;max-height:45%;overflow:auto;margin:0;padding:6px;background:rgba(150,0,0,.92);color:#fff;font:11px monospace;white-space:pre-wrap;z-index:99999;touch-action:auto;user-select:text';(document.body||document.documentElement).appendChild(d)}d.textContent+=m+'\n'}
window.addEventListener('error',function(e){show('LỖI: '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno+')')});
window.addEventListener('unhandledrejection',function(e){show('LỖI PROMISE: '+(e.reason&&e.reason.message||e.reason))});})();
</script>
<script>
// Chống thu phóng khi bấm liên tục / chụm 2 ngón (không đụng tới pointer/touch của joystick và nút chiêu)
(function(){var last=0;
document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<350&&e.target.closest&&!e.target.closest('#popup,#guide,#tp,#kp,#start'))e.preventDefault();last=n},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
document.addEventListener('dblclick',function(e){e.preventDefault()});
document.addEventListener('touchmove',function(e){if(e.scale&&e.scale!==1)e.preventDefault()},{passive:false});
})();
</script></head>
<body>
<div id="top">
 <div id="hudL"><div class="t c">HP: <span id="hpT">100</span>/100</div><div class="bar hpb"><i id="hp"></i></div>
  <div class="t b">THỂ LỰC: <span id="stT">100</span>/100</div><div class="bar stb"><i id="st"></i></div>
  <div class="t y">KILLS: <span id="killT">0</span></div></div>
 <div id="hudR"><div class="badge g" id="bStyle">KIẾM PHÁP</div><div class="badge o" id="bSword">KIẾM</div><div id="buffs"></div></div>
</div>
<div id="start"><h1>TỔNG HỢP KIẾM PHÁP</h1><p>Chạm để vào game<br><small>(toàn màn hình + tự xoay ngang)</small></p></div>
<div id="flash"></div><div id="cb1" class="cb"></div><div id="cb2" class="cb"></div><div id="banner"></div><div id="toast"></div>
<div id="popup"><div id="ptitle"></div><div id="popts"></div></div>
<div id="guide"><div id="gtabs"></div><div id="gbody"></div><button id="gclose">Đóng</button></div>
<div id="dmg"></div><div id="eh"><div id="ehF"></div><span id="ehT"></span></div>
<div id="tp"><span>MÁU QUÁI</span><input id="tpC" type="text" readonly tabindex="-1"><b>/</b><input id="tpM" type="text" readonly inputmode="none"><button id="tpSet">Đặt</button><button id="tpFull">Đầy</button></div>
<div id="kp"></div>
<div id="joy"><b id="knob"></b></div>
<div id="colL" class="col"></div><div id="colR" class="col"></div><div id="btns"></div>
<script src="lib/three.min.js"></script>
<script>if(typeof THREE==="undefined")document.body.insertAdjacentHTML("beforeend","<p style='position:fixed;top:40%;width:100%;text-align:center'>Không tải được lib/three.min.js — hãy chạy server trong đúng thư mục thienmenh (xem README).</p>")</script>
<script src="skills.js"></script>
<script src="beasts.js"></script>
<script src="game.js"></script><script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(function(){})</script></body></html>
